aid: world-view
name: World View
description: 'World View (World View Enterprises) is a Tucson, Arizona-based stratospheric
  balloon company focused on remote sensing and persistent intelligence, surveillance,
  and reconnaissance (ISR). Its uncrewed high-altitude balloons carry EO/FMV, IR,
  SAR, and hyperspectral sensors for defense, government, and commercial missions.
  Acquired by Ondas Holdings in 2026, it now operates as part of the Ondas Sentinel
  multi-domain intelligence platform, with partnerships including Palantir and Sierra
  Nevada Corporation. World View publishes no public developer program or API.'
